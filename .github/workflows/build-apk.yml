name: Build VerbVibe Play Store AAB & Test APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Install dependencies & sync Capacitor
        run: |
          npm install
          node build-web.js
          npx cap sync android

      - name: Decode Release Keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/release-keystore.jks

      - name: Build Signed Release AAB & Debug APK
        env:
          ANDROID_KEYSTORE_PATH: release-keystore.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew bundleRelease assembleDebug --stacktrace

      - name: Clean up temporary keystore
        if: always()
        run: rm -f android/app/release-keystore.jks

      - name: Upload Play Store AAB
        uses: actions/upload-artifact@v4
        with:
          name: VerbVibe-PlayStore-AAB
          path: android/app/build/outputs/bundle/release/app-release.aab

      - name: Upload Test APK
        uses: actions/upload-artifact@v4
        with:
          name: VerbVibe-Test-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
