<script>
(function() {
  if (window.AndroidTTS) {
    let activeUtterance = null;

    window.SpeechSynthesisUtterance = function(text) {
      this.text = text || '';
      this.lang = 'en-IN';
      this.rate = 0.82;
      this.pitch = 1.1;
      this.volume = 1;
      this.voice = null;
      this.onstart = null;
      this.onend = null;
      this.onerror = null;
      this.onboundary = null;
    };

    window.__onNativeTTSStart = function() {
      nativeSynth.speaking = true;
      if (activeUtterance && typeof activeUtterance.onstart === 'function') {
        activeUtterance.onstart();
      }
    };

    window.__onNativeTTSBoundary = function(start, end) {
      if (activeUtterance && typeof activeUtterance.onboundary === 'function') {
        activeUtterance.onboundary({ charIndex: start, charLength: end - start, name: 'word' });
      }
    };

    window.__onNativeTTSEnd = function() {
      nativeSynth.speaking = false;
      if (activeUtterance && typeof activeUtterance.onend === 'function') {
        activeUtterance.onend();
      }
      activeUtterance = null;
    };

    const nativeSynth = {
      speaking: false,
      pending: false,
      paused: false,
      onvoiceschanged: null,
      getVoices: function() {
        return [{
          name: 'Indian English (Android Native)',
          lang: 'en-IN',
          default: true,
          localService: true,
          voiceURI: 'android-en-in'
        }];
      },
      speak: function(utterance) {
        if (!utterance) return;
        activeUtterance = utterance;
        nativeSynth.speaking = true;
        const rate = Number(utterance.rate) || 0.82;
        const pitch = Number(utterance.pitch) || 1.1;
        window.AndroidTTS.speak(String(utterance.text || ''), rate, pitch);
      },
      cancel: function() {
        nativeSynth.speaking = false;
        activeUtterance = null;
        window.AndroidTTS.stop();
      },
      pause: function() { window.AndroidTTS.stop(); },
      resume: function() {}
    };

    try {
      Object.defineProperty(window, 'speechSynthesis', { value: nativeSynth, configurable: true });
    } catch (e) {
      window.speechSynthesis = nativeSynth;
    }
  }
})();

    // ========================================================
    // SYNTHETIC SFX ENGINE (Web Audio API)
    // ========================================================
    class ArcadeSFX {
      constructor() {
        this.ctx = null;
      }
      init() {
        if (!this.ctx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          if (AudioContext) {
            this.ctx = new AudioContext();
          }
        }
        if (this.ctx && this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      }
      playBlip(freq = 520, duration = 0.08) {
        try {
          this.init();
          if (!this.ctx) return;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(freq * 1.5, this.ctx.currentTime + duration);
          gain.gain.setValueAtTime(0.18, this.ctx.currentTime);

    // ========================================================
    // TENSE DATA & TARGET WORD HELPER
    // ========================================================
    const getTenseData = (verbItem, tenseKey) => {
      if (!verbItem) return { sentence: '', text: '', targetWord: '' };

      if (verbItem.examples && verbItem.examples[tenseKey]) {
        const ex = verbItem.examples[tenseKey];
        const s = ex.sentence || ex.text || '';
        return { sentence: s, text: s, targetWord: ex.targetWord || '' };
      }

      const mappedKey = tenseKey === 'present' || tenseKey === 'v1' ? 'base' : (tenseKey === 'continuous' || tenseKey === 'vIng' ? 'continuous' : 'past');
      if (verbItem.sentences && verbItem.sentences[mappedKey]) {
        const sentence = verbItem.sentences[mappedKey];
        const targetWord = (verbItem.highlightWords && verbItem.highlightWords[mappedKey]) || (verbItem.forms && verbItem.forms[mappedKey]) || verbItem.verb;
        return { sentence, text: sentence, targetWord };
      }

      const base = (verbItem.verb || '').toLowerCase();
      const v1 = verbItem.v1 || (verbItem.forms ? verbItem.forms.base : base);
      const v2 = verbItem.v2 || (verbItem.forms ? verbItem.forms.past : `${base}ed`);
      const vIng = verbItem.vIng || (verbItem.forms ? verbItem.forms.continuous || verbItem.forms.presentParticiple : `${base}ing`);

      let sentence = '';
      let targetWord = '';
      switch (tenseKey) {
        case 'past':
        case 'v2':
          sentence = `The boy ${v2} the soccer ball directly into the net!`;
          targetWord = v2;
          break;
        case 'continuous':
        case 'vIng':
          sentence = `The boy is ${vIng} the soccer ball directly into the net!`;
          targetWord = vIng;
          break;
        case 'present':
        case 'v1':
        default:
          sentence = verbItem.example || `The boy ${v1}s the soccer ball directly into the net!`;
          targetWord = v1;
          break;
      }
      return { sentence, text: sentence, targetWord };
    };
    const getTenseExample = getTenseData;

    // ========================================================
    // CENTRALIZED VOICE RESOLUTION HELPER
    // ========================================================
    function getActiveVoice(targetIdentifier) {
      if (!('speechSynthesis' in window)) return null;
      const voices = window.speechSynthesis.getVoices();
      if (!voices.length) return null;

      const savedIdentifier = targetIdentifier || 
                              localStorage.getItem('verbvibe_voice') || 
                              localStorage.getItem('verbvibe_voice_name') || 
                              localStorage.getItem('verbvibe_selected_voice') || '';

      // If user has a valid saved selection, use it:
      if (savedIdentifier) {
        let matched = voices.find(v => v.voiceURI === savedIdentifier || v.name === savedIdentifier);
        if (matched) return matched;

        matched = voices.find(v => {
          const cleanSaved = savedIdentifier.replace(/\s*\([^)]*\)\s*$/, '').trim().toLowerCase();
          const cleanName = v.name.replace(/\s*\([^)]*\)\s*$/, '').trim().toLowerCase();
          return v.name.toLowerCase().includes(cleanSaved) || cleanSaved.includes(cleanName);
        });
        if (matched) return matched;
      }

      // DEFAULT LOGIC: Automatically select Indian English (en-IN)
      // Priority: Google English (India) > Microsoft Ravi/Heera > Rishi/Veena > any en-IN
      const indianVoice = voices.find(v => 
        (v.lang === 'en-IN' || (v.lang && v.lang.replace('_', '-').toLowerCase() === 'en-in')) && 
        (v.name.includes('Google') || v.name.includes('Natural'))
      ) || voices.find(v => 
        v.name.toLowerCase().includes('ravi') ||
        v.name.toLowerCase().includes('heera') ||
        v.name.toLowerCase().includes('rishi') ||
        v.name.toLowerCase().includes('veena')
      ) || voices.find(v => 
        v.lang === 'en-IN' || 
        (v.lang && v.lang.replace('_', '-').toLowerCase() === 'en-in') ||
        v.name.toLowerCase().includes('india')
      );

      if (indianVoice) return indianVoice;

      // Fallbacks if no en-IN voice exists on the host device:
      return voices.find(v => v.lang.startsWith('en')) || voices[0];
    }

    const ReelsTab = ({

      const [activeWordIdx, setActiveWordIdx] = useState(-1);

      const [selectedTense, setSelectedTense] = useState('present'); // 'present', 'past', 'continuous'

        setSelectedTense('present');

      // Whenever user swipes or navigates to a new reel, persist to localStorage
      useEffect(() => {
        if (typeof activeReelIdx === 'number') {
          localStorage.setItem('verbvibe_last_reel_idx', activeReelIdx);
        }
      }, [activeReelIdx]);

      // Stop speech and reset highlight when active reel changes
      useEffect(() => {
        if ('speechSynthesis' in window) {
          window.speechSynthesis.cancel();
        }
        if (speechTimerRef.current) clearInterval(speechTimerRef.current);
        setActiveWordIdx(-1);
      }, [activeReelIdx]);

      // Instant Auto-Play when returning to Reels tab, pause when navigating away
      useEffect(() => {
        const container = containerRef.current;
        if (activeTab === 'reels') {
          const syncAndPlay = () => {
            if (container) {
              const targetCard = container.querySelector('.reel-card[data-index="' + activeReelIdx + '"]');
              if (targetCard) {
                targetCard.scrollIntoView({ behavior: 'auto' });
              }
              const reelVideos = container.querySelectorAll('video[data-reel-index]');
              reelVideos.forEach(v => {
                if (v.getAttribute('data-reel-index') !== String(activeReelIdx)) {
                  v.pause();
                }
              });
              const activeVideo = container.querySelector(`video[data-reel-index="${activeReelIdx}"]`);
              if (activeVideo) {
                activeVideo.muted = true; // Ensure browser autoplay policies pass
                activeVideo.play().catch(() => {});
              }
            }
          };
          syncAndPlay();
          const rafId = requestAnimationFrame(syncAndPlay);
          return () => cancelAnimationFrame(rafId);
        } else {
          // Pause reel videos when navigating away to save battery and performance
          if (container) {
            const reelVideos = container.querySelectorAll('video[data-reel-index]');
            reelVideos.forEach(v => v.pause());
          }
          if ('speechSynthesis' in window) window.speechSynthesis.cancel();
        }
      }, [activeTab, activeReelIdx]);

      // 2-reel sliding lookahead preloading and CacheStorage
      useEffect(() => {
        const targetIndices = [activeReelIdx + 1, activeReelIdx + 2, activeReelIdx - 1];
        targetIndices.forEach(idx => {
          if (idx >= 0 && idx < verbs.length) {
            const item = verbs[idx];
            if (item && item.videoUrl) {
              const link = document.createElement('link');
              link.rel = 'prefetch';
              link.as = 'video';
              link.href = item.videoUrl;
              document.head.appendChild(link);

              cacheVideoUrl(item.videoUrl);
            }
          }
        });
      }, [activeReelIdx, verbs]);

      // Precise word-tracking speech function with mobile touch fallback timer & settings voice support
      const speakSentenceWithHighlight = (text) => {
        if (trackTrophyAction) trackTrophyAction('audioPlayed');
        if (!('speechSynthesis' in window)) return;
        window.speechSynthesis.cancel();
        if (speechTimerRef.current) clearInterval(speechTimerRef.current);
        setActiveWordIdx(-1);

        const utterance = new SpeechSynthesisUtterance(text);
        
        const activeVoice = getActiveVoice();
        if (activeVoice) {
          utterance.voice = activeVoice;
          utterance.lang = activeVoice.lang;
        } else {
          utterance.lang = 'en-IN'; // Fallback to Indian English locale
        }

        utterance.rate = 0.88;
        utterance.pitch = 1.0;

        const words = text.trim().split(/\s+/);
        let receivedBoundary = false;

        // Method A: Native onboundary (fires on Desktop & supported Android WebViews)
        utterance.onboundary = (e) => {
          if (e.name === 'word') {
            receivedBoundary = true;
            const charIndex = e.charIndex;
            let accumulated = 0;
            for (let i = 0; i < words.length; i++) {
              const wordStart = text.indexOf(words[i], accumulated);
              accumulated = wordStart + words[i].length;
              if (charIndex >= wordStart && charIndex <= accumulated) {
                setActiveWordIdx(i);
                break;
              }
            }
          }
        };

        // Method B: Mobile fallback timer if onboundary doesn't fire
        utterance.onstart = () => {
          setActiveWordIdx(0);
          setTimeout(() => {
            if (!receivedBoundary) {
              // Estimated pace: ~280ms per word at 0.88 speech rate
              let currentIdx = 0;
              speechTimerRef.current = setInterval(() => {
                currentIdx++;
                if (currentIdx < words.length) {
                  setActiveWordIdx(currentIdx);
                } else {
                  clearInterval(speechTimerRef.current);
                }
              }, 290);
            }
          }, 350);
        };

        utterance.onend = () => {
          if (speechTimerRef.current) clearInterval(speechTimerRef.current);
          setActiveWordIdx(-1);
        };

        utterance.onerror = () => {
          if (speechTimerRef.current) clearInterval(speechTimerRef.current);
          setActiveWordIdx(-1);
        };

        window.speechSynthesis.speak(utterance);
      };

      // Scroll to activeReelIdx on mount (e.g. redirected from Action Verb Library)
      useEffect(() => {
        const container = containerRef.current;
        if (!container) return;

        if (activeReelIdx > 0) {
          isInitialScrollDone.current = false;
          const scrollToTarget = () => {
            const targetCard = container.querySelector('.reel-card[data-index="' + activeReelIdx + '"]');
            if (targetCard) {
              targetCard.scrollIntoView({ behavior: 'auto' });
            } else if (container.clientHeight) {
              container.scrollTop = activeReelIdx * container.clientHeight;
            }
          };

          scrollToTarget();
          const af = requestAnimationFrame(scrollToTarget);
          const timer = setTimeout(() => {
            scrollToTarget();
            isInitialScrollDone.current = true;
          }, 350);

          return () => {
            cancelAnimationFrame(af);
            clearTimeout(timer);
          };
        } else {
          isInitialScrollDone.current = true;
        }
      }, []);

      // Intersection Observer for Butter-Smooth Native Scroll-Snap Detection
      useEffect(() => {
        const container = containerRef.current;
        if (!container) return;

        const options = { root: container, threshold: 0.65 };
        const observer = new IntersectionObserver((entries) => {
          entries.forEach(entry => {
            if (entry.isIntersecting) {
              const idx = parseInt(entry.target.getAttribute('data-index'), 10);
              if (!isNaN(idx) && idx !== activeReelIdx) {
                if (!isInitialScrollDone.current) {
                  return;
                }
                setActiveReelIdx(idx);
                localStorage.setItem('verbvibe_last_reel_idx', idx);
                sfx.playWhoosh();
                if ('speechSynthesis' in window) {
                  window.speechSynthesis.cancel();
                }
              }
            }
          });
        }, options);

        const cards = container.querySelectorAll('.reel-card');
        cards.forEach(card => observer.observe(card));

        return () => observer.disconnect();
      }, [activeReelIdx, setActiveReelIdx]);

      // Desktop Keyboard Navigation
      useEffect(() => {
        const handleKeyDown = (e) => {
          if (!containerRef.current) return;
          const container = containerRef.current;
          const cardHeight = container.clientHeight;

          if (e.key === 'ArrowDown') {
            e.preventDefault();
            if (activeReelIdx < verbs.length - 1) {
              container.scrollTo({ top: (activeReelIdx + 1) * cardHeight, behavior: 'smooth' });
            } else {
              // Loop back to reel 1
              container.scrollTo({ top: 0, behavior: 'smooth' });
            }
          } else if (e.key === 'ArrowUp') {
            e.preventDefault();
            if (activeReelIdx > 0) {
              container.scrollTo({ top: (activeReelIdx - 1) * cardHeight, behavior: 'smooth' });
            }
          } else if (e.key === ' ') {
            e.preventDefault();
            const curVerb = verbs[activeReelIdx]; speakSentenceWithHighlight(curVerb ? (curVerb.example || (curVerb.sentences ? (curVerb.sentences[selectedTense] || curVerb.sentences.base) : '')) : '');
          }
        };

        window.addEventListener('keydown', handleKeyDown);
        return () => window.removeEventListener('keydown', handleKeyDown);
      }, [activeReelIdx, verbs.length, speakSentence]);

      // Seamless Loop to Reel 1 when scrolling/swiping past the last reel
      useEffect(() => {
        const container = containerRef.current;
        if (!container) return;

        let touchStartY = 0;
        let isAtBottom = false;

        const onTouchStart = (e) => {
          touchStartY = e.touches[0].clientY;
          const maxScroll = container.scrollHeight - container.clientHeight;
          isAtBottom = container.scrollTop >= maxScroll - 15;
        };

        const onTouchEnd = (e) => {
          const deltaY = touchStartY - e.changedTouches[0].clientY;
          if (isAtBottom && deltaY > 35 && activeReelIdx >= verbs.length - 1) {
            container.scrollTo({ top: 0, behavior: 'smooth' });
          }
        };

        const onWheel = (e) => {
          const maxScroll = container.scrollHeight - container.clientHeight;
          if (e.deltaY > 15 && container.scrollTop >= maxScroll - 5 && activeReelIdx >= verbs.length - 1) {
            e.preventDefault();
            container.scrollTo({ top: 0, behavior: 'smooth' });
          }
        };

        container.addEventListener('touchstart', onTouchStart, { passive: true });
        container.addEventListener('touchend', onTouchEnd, { passive: true });
        container.addEventListener('wheel', onWheel, { passive: false });

        return () => {
          container.removeEventListener('touchstart', onTouchStart);
          container.removeEventListener('touchend', onTouchEnd);
          container.removeEventListener('wheel', onWheel);
        };
      }, [activeReelIdx, verbs.length]);

      return (
        <div 
          ref={containerRef}
          className="w-full h-full relative overflow-y-scroll snap-y snap-mandatory no-scrollbar"
        >
          {verbs.map((verbItem, idx) => {
            const tenseData = getTenseData(verbItem, selectedTense);
            const currentSentence = tenseData.sentence;
            const targetWord = tenseData.targetWord;
            verbItem.example = currentSentence;

            const tenseOptions = [
              { id: 'present', label: verbItem.v1 || (verbItem.forms ? verbItem.forms.base : verbItem.verb.toLowerCase()) },
              { id: 'past', label: verbItem.v2 || (verbItem.forms ? verbItem.forms.past : `${verbItem.verb.toLowerCase()}ed`) },
              { id: 'continuous', label: verbItem.vIng || (verbItem.forms ? verbItem.forms.continuous || verbItem.forms.presentParticiple : `${verbItem.verb.toLowerCase()}ing`) }
            ];
            const isBookmarked = !!savedVerbIds[verbItem.id];

            return (
              <div
                key={verbItem.id}
                data-index={idx}
                className="reel-card w-full h-full relative snap-start snap-always overflow-hidden flex flex-col justify-between"
              >
                {/* Background: Video Layer with Fallback */}
{verbItem.videoUrl ? (
  <div 
    onClick={() => speakWord()}
    className="absolute inset-0 w-full h-full cursor-pointer overflow-hidden bg-black z-0"
  >
    <video
      data-reel-index={idx}
      src={verbItem.videoUrl}
      autoPlay
      loop
      muted
      playsInline
      preload={Math.abs(activeReelIdx - idx) <= 1 ? "auto" : "metadata"}
      className="w-full h-full object-cover"

    {/* Dark gradient overlay so text and UI overlays stay crisp */}
    <div className="absolute inset-0 bg-gradient-to-b from-black/40 via-transparent to-black/85 pointer-events-none" />
  </div>
) : (
  <VerbScene 
    verb={verbItem} 
    isPlayingAudio={isSpeaking && activeReelIdx === idx}
    onSceneTap={() => {
      speakWord();
    }}
  />
)}


                {/* Right Action Rail (Vertical Dock Stacked Neatly on Right) */}
                <div className="absolute right-2.5 bottom-3 z-30 flex flex-col items-center gap-2.5">

{/* Action 4: Bookmark / Save */}

                  {/* Top Row: Verb Title, Phonetic, and Equalizer Audio Button */}

                    >

                      <span className={`w-0.5 h-3 rounded-full bg-rose-500 ${(isSpeaking || activeWordIdx !== -1) && activeReelIdx === idx ? 'animate-bounce delay-75' : ''}`} />
                      <span className={`w-0.5 h-3.5 rounded-full bg-cyan-300 ${(isSpeaking || activeWordIdx !== -1) && activeReelIdx === idx ? 'animate-bounce delay-150' : ''}`} />
                      <span className={`w-0.5 h-2 rounded-full bg-amber-400 ${(isSpeaking || activeWordIdx !== -1) && activeReelIdx === idx ? 'animate-bounce' : ''}`} />
                    </button>
                  </div>

                  {/* Action definition */}
                  <p className="text-[10px] text-slate-300/90 mb-1.5 leading-tight line-clamp-2">
                    <span className="text-white font-semibold">Action: </span>
                    {verbItem.definition || "To strike out strongly with your foot to propel an object forward!"}
                  </p>

                  {/* Sentence Card with Cyan Boxed Target Word */}
                  <div 
                    onClick={() => speakSentenceWithHighlight(currentSentence)}

                      {currentSentence.trim().split(/\s+/).map((word, wIdx) => {
                        const cleanWord = word.replace(/[^a-zA-Z]/g, '').toLowerCase();

                        return (
                          <span
                            key={wIdx}
                            className={`inline-block transition-colors duration-150 rounded px-1 py-0 mx-0.5 ${

                                : isTargetTenseWord
                                ? 'border border-cyan-400/80 text-cyan-300 font-bold rounded px-1 py-0 bg-cyan-500/10 text-[11px] sm:text-xs'
                                : 'text-white'
                            }`}
                          >
                            {word}
                          </span>
                        );
                      })}
                    </p>

                  {/* Tense Selector Row */}

                    <span className="text-[9px] font-bold text-slate-400 mr-0.5">

                    </span>

                      <button
                        key={tense.id}
                        onClick={() => {
                          setSelectedTense(tense.id);
                          if (trackTrophyAction) trackTrophyAction('tensesSwitched');
                          if ('speechSynthesis' in window) window.speechSynthesis.cancel();
                          setActiveWordIdx(-1);
                        }}
                        className={`text-[10px] font-semibold px-2 py-0.5 rounded-full transition-all ${
                          selectedTense === tense.id
                            ? 'bg-cyan-400 text-slate-950 font-bold shadow-sm'
                            : 'bg-black/30 text-slate-300 hover:bg-black/50'
                        }`}
                      >
                        {tense.label}
                      </button>
                    ))}
                  </div>

                </div>
                {/* Interactive Loop Back to Reel 1 Button on Last Reel */}
                {idx === verbs.length - 1 && (
                  <div className="absolute top-14 inset-x-0 z-30 flex justify-center pointer-events-auto">
                    <button
                      onClick={() => {
                        sfx.playWhoosh();
                        containerRef.current?.scrollTo({ top: 0, behavior: 'smooth' });
                      }}
                      className="px-4 py-2 rounded-full bg-gradient-to-r from-arcade-cyan via-arcade-emerald to-arcade-cyan text-black text-xs font-black shadow-sm flex items-center gap-2 active:scale-95 transition-all hover:scale-105 border border-white/20"
                    >
                      <Icon name="zap" size={14} color="#060814"/>
                      <span>Next: Loop to Reel #1 {'\uD83D\uDD04'}</span>
                    </button>
                  </div>
                )}
              </div>
            );
          })}
        </div>
      );
    };

    // ========================================================
    // TAB 2: DECK & FLASHCARDS (FULL STITCH SPECIFICATION)
    // ========================================================
    // Helper: Select today's featured flashcard verb (cycles daily through verbs with video reels)
    const getDailyHeroVerbIdx = (verbsList) => {
      if (!verbsList || verbsList.length === 0) return 0;
      const now = new Date();
      const dayNumber = Math.floor((new Date(now.getFullYear(), now.getMonth(), now.getDate()) - new Date(2024, 0, 1)) / (1000 * 60 * 60 * 24));
      const videoIndices = [];
      verbsList.forEach((v, idx) => {
        if (v.videoUrl) videoIndices.push(idx);
      });
      if (videoIndices.length > 0) {
        return videoIndices[Math.abs(dayNumber) % videoIndices.length];
      }
      return Math.abs(dayNumber) % verbsList.length;
    };

    const DeckTab = ({ verbs, savedVerbIds, toggleBookmark, speakWordCustom, onHeroReviewInReel, setXp, showToast, vaultProgress = {}, setVaultProgress }) => {
      const [searchQuery, setSearchQuery] = useState('');
      const [categoryFilter, setCategoryFilter] = useState('all');
      const [viewSavedOnly, setViewSavedOnly] = useState(false);
      const [vaultFilter, setVaultFilter] = useState('all'); // 'all' | 'mastered' | 'practicing' | 'due'
      
      // Hero Flashcard State (Defaults to Jump or Active Verb)
      // Hero Flashcard State: Updates automatically daily at midnight
      const [heroVerbIdx, setHeroVerbIdx] = useState(() => getDailyHeroVerbIdx(verbs));
      const [heroIsFlipped, setHeroIsFlipped] = useState(false);
      const getTodayDateStr = () => {
        const d = new Date();
        return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
      };
      const todayDateStr = getTodayDateStr();
      const [isDailyMastered, setIsDailyMastered] = useState(() => {
        try {
          return localStorage.getItem('verbvibe_daily_blitz_mastered_date') === todayDateStr;
        } catch(e) { return false; }
      });
      const [heroGotItCelebrated, setHeroGotItCelebrated] = useState(false);

      useEffect(() => {
        setHeroVerbIdx(getDailyHeroVerbIdx(verbs));
      }, [verbs]);
      const heroVerb = verbs[heroVerbIdx] || verbs[0];

      // Live SRS / Mastery counts from vaultProgress
      const nowTs = Date.now();
      const trackedIds = Object.keys(vaultProgress || {});
      const knowItCount = trackedIds.filter(id => vaultProgress[id]?.status === 'mastered').length;
      const practicingCount = trackedIds.filter(id => vaultProgress[id]?.status === 'practicing').length;
      const playTodayCount = trackedIds.filter(id => (vaultProgress[id]?.nextReview || 0) <= nowTs).length;
      const savedCount = Object.keys(savedVerbIds || {}).filter(k => !!savedVerbIds[k]).length;

      const toggleMastered = (verbId) => {
        if (!setVaultProgress) return;
        const now = Date.now();
        const isCurrentlyMastered = vaultProgress[verbId]?.status === 'mastered';
        if (!isCurrentlyMastered) {
          sfx.playGoalChime();
          setVaultProgress(prev => ({
            ...prev,
            [verbId]: { status: 'mastered', nextReview: now + 3 * 24 * 60 * 60 * 1000 }
          }));
          let claimedKnowIt = {};
          try { claimedKnowIt = JSON.parse(localStorage.getItem('verbvibe_knowit_xp_claimed') || '{}'); } catch(e) {}
          if (!claimedKnowIt[verbId]) {
            claimedKnowIt[verbId] = true;
            try { localStorage.setItem('verbvibe_knowit_xp_claimed', JSON.stringify(claimedKnowIt)); const cr = JSON.parse(localStorage.getItem('verbvibe_knowit_xp_credited') || '{}'); cr[verbId] = true; localStorage.setItem('verbvibe_knowit_xp_credited', JSON.stringify(cr)); } catch(e) {}
            if (setXp) setXp(prev => prev + 10);
          }
        } else {
          sfx.playBlip(540);
          setVaultProgress(prev => {
            const next = { ...prev };
            delete next[verbId];
            return next;
          });
        }
      };

      const filteredVerbs = useMemo(() => {
        const now = Date.now();
        return verbs.filter(v => {
          if (viewSavedOnly && !savedVerbIds[v.id]) return false;
          if (vaultFilter === 'mastered' && vaultProgress[v.id]?.status !== 'mastered') return false;
          if (vaultFilter === 'practicing' && vaultProgress[v.id]?.status !== 'practicing') return false;
          if (vaultFilter === 'due' && (!vaultProgress[v.id] || (vaultProgress[v.id]?.nextReview || 0) > now)) return false;
          if (categoryFilter !== 'all' && v.category.toLowerCase() !== categoryFilter.toLowerCase()) return false;
          if (searchQuery.trim()) {
            const q = searchQuery.toLowerCase();
            return v.verb.toLowerCase().includes(q) || v.definition.toLowerCase().includes(q) || v.forms.base.includes(q) || v.forms.past.includes(q);

      const handleGotIt = () => {

        setIsDailyMastered(true);

        if (showToast) showToast('Mastered flashcard! +15 XP');
      };

      return (
        <div className="w-full h-full overflow-y-auto px-4 pt-4 pb-32 space-y-4 no-scrollbar">
          
          {/* 1. VERB VAULT PROGRESS HEADER (LIVE SRS & INTERACTIVE FILTERS) */}
          <div className="p-4 rounded-2xl glass-card border border-white/10 relative shadow-lg">

    };

    // ========================================================
    // TAB 3: QUESTS (DYNAMIC STREAK & NO BOSS BATTLE)
    // ========================================================
    // ========================================================
    // HELPER: Build daily quiz from verb data (date-seeded)
    // ========================================================
    const getTodayStr = () => {
      const d = new Date();
      return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
    };

    const buildDailyQuiz = (dateStr) => {
      let seed = 0;
      for (let i = 0; i < dateStr.length; i++) seed += dateStr.charCodeAt(i) * (i + 1);

      const pool = ACTION_VERBS.filter(v => v.forms && v.forms.past && v.forms.continuous);
      const questions = [];
      const questionTypes = ['past', 'continuous', 'base'];

      for (let q = 0; q < 5; q++) {
        const verbIdx = (seed * (q + 3) + q * 17) % pool.length;
        const verb = pool[verbIdx];
        const typeIdx = (seed + q) % questionTypes.length;
        const tenseKey = questionTypes[typeIdx];

        const tenseLabel = tenseKey === 'past' ? 'Past Tense' : tenseKey === 'continuous' ? 'Present Continuous' : 'Base Form';
        const correctAnswer = verb.forms[tenseKey];

        const wrongAnswers = [];
        const otherForms = tenseKey === 'past'
          ? [verb.forms.continuous, verb.forms.base + 'ed', verb.verb + 'er']
          : tenseKey === 'continuous'
            ? [verb.forms.past, verb.forms.base + 's', verb.verb + 'tion']
            : [verb.forms.past, verb.forms.continuous, verb.verb + 'ly'];

        for (const w of otherForms) {
          if (w && w !== correctAnswer && !wrongAnswers.includes(w)) wrongAnswers.push(w);
        }

        let fillIdx = 0;
        while (wrongAnswers.length < 3) {
          const otherVerb = pool[(verbIdx + fillIdx + 1) % pool.length];
          const candidate = otherVerb.forms[tenseKey];
          if (candidate && candidate !== correctAnswer && !wrongAnswers.includes(candidate)) {
            wrongAnswers.push(candidate);
          }
          fillIdx++;
          if (fillIdx > pool.length) break;
        }

        const options = wrongAnswers.slice(0, 3);
        const correctPos = (seed + q * 7) % 4;
        options.splice(correctPos, 0, correctAnswer);

        questions.push({
          id: q,
          verb: verb.verb,
          tenseKey,
          tenseLabel,
          correctAnswer,
          correctIdx: correctPos,
          options: options.slice(0, 4),
        });
      }
      return questions;
    };

    // ========================================================
    // TAB 3: QUESTS (DYNAMIC STREAK & DAILY GRAMMAR BLITZ)
    // ========================================================
    const QuestsTab = ({ 
      xp, 
      setXp, 
      streak, 
      isPracticedToday, 
      doDailyPractice,
      trackTrophyAction
    }) => {
      const todayStr = getTodayStr();

      // Blitz state (persisted per day via localStorage)
      const [blitzStarted, setBlitzStarted] = useState(false);
      const [blitzCurrentQ, setBlitzCurrentQ] = useState(0);
      const [blitzScore, setBlitzScore] = useState(0);
      const [blitzAnswered, setBlitzAnswered] = useState(null);
      const [blitzTimer, setBlitzTimer] = useState(30);

      const [blitzDone, setBlitzDone] = useState(() => {
        try {
          const savedDate = localStorage.getItem('verbvibe_blitz_date');
          if (savedDate === todayStr) {
            return localStorage.getItem('verbvibe_blitz_done') === 'true';
          }
          return false;
        } catch (e) { return false; }
      });

      const [blitzXpClaimed, setBlitzXpClaimed] = useState(() => {
        try {
          const savedDate = localStorage.getItem('verbvibe_blitz_date');
          if (savedDate === todayStr) {
            return localStorage.getItem('verbvibe_blitz_xp_claimed') === 'true';
          }
          return false;
        } catch (e) { return false; }
      });

      const [blitzFinalScore, setBlitzFinalScore] = useState(() => {
        try {
          const savedDate = localStorage.getItem('verbvibe_blitz_date');
          if (savedDate === todayStr) {
            const s = localStorage.getItem('verbvibe_blitz_score');
            return s ? parseInt(s, 10) : 0;
          }
          return 0;
        } catch (e) { return 0; }
      });

      // Build quiz questions for today (date-seeded)
      const quizQuestions = React.useMemo(() => buildDailyQuiz(todayStr), [todayStr]);

      // Timer countdown
      useEffect(() => {
        if (!blitzStarted || blitzDone) return;
        if (blitzTimer <= 0) {
          finishBlitz(blitzScore);
          return;
        }
        const tid = setTimeout(() => setBlitzTimer(t => t - 1), 1000);
        return () => clearTimeout(tid);
      }, [blitzStarted, blitzTimer, blitzDone]);

      const startBlitz = () => {
        setBlitzStarted(true);
        setBlitzCurrentQ(0);
        setBlitzScore(0);
        setBlitzAnswered(null);
        setBlitzTimer(30);
      };

      const finishBlitz = (finalScore) => {
        setBlitzDone(true);
        setBlitzFinalScore(finalScore);
        try {
          localStorage.setItem('verbvibe_blitz_date', todayStr);
          localStorage.setItem('verbvibe_blitz_done', 'true');
          localStorage.setItem('verbvibe_blitz_score', finalScore.toString());
        } catch (e) {}
      };

        // ========================================================

      const currentLevelXp = xp % XP_PER_LEVEL;
      const progressPercent = Math.round((currentLevelXp / XP_PER_LEVEL) * 100);

      // Dynamic Rank Titles based on total XP milestones
      let rankTitle = 'Rookie Learner';
      let rankBadge = '🌱';
      if (xp >= 5000) {
        rankTitle = 'Mythic Verb Deity';
        rankBadge = '🌌';
      } else if (xp >= 3500) {
        rankTitle = 'Immortal Linguist';
        rankBadge = '🔥';
      } else if (xp >= 2000) {
        rankTitle = 'Prestige Legend';
        rankBadge = '⚡';
      } else if (xp >= 1000) {
        rankTitle = 'VerbVibe Grandmaster';
        rankBadge = '👑';
      } else if (xp >= 500) {
        rankTitle = 'Action Master';
        rankBadge = '💎';
      } else if (xp >= 200) {
        rankTitle = 'Rising Striker';
        rankBadge = '⚔️';
      }

      return {
        level,
        currentLevelXp,
        nextLevelXp: XP_PER_LEVEL,
        progressPercent,
        rankTitle,
        rankBadge,
        isPrestige: xp >= 2000
      };

        { id: 'reel_explorer', title: 'Reel Explorer', desc: 'Explore 15 action verb reels', icon: '🎬', target: 15, statKey: 'reelsViewed', xpReward: 30 },

                        )}
                      </span>
                      {isUnlocked ? (

                      <div className="flex items-center justify-between gap-1">
                        <h4 className="text-xs font-bold text-white">{trophy.title}</h4>

                          isUnlocked

                    <div className="mt-2.5 pt-1.5 border-t border-white/5">
                      <div className="w-full h-1.5 rounded-full bg-black/50 overflow-hidden border border-white/5">

                          className={`h-full rounded-full transition-all duration-500 ${

                          style={{ width: `${progressPct}%` }}

                      </div>
                    </div>

                );
              })}
            </div>
          </div>
        </div>
      );
    };

    // ========================================================

    // ========================================================
    const ONBOARDING_SLIDES = [
      {

    // ========================================================
    // MAIN APP COMPONENT
    // ========================================================
    const App = () => {
      const [showOnboarding, setShowOnboarding] = useState(() => {

      const [activeTab, setActiveTab] = useState('reels');
      const [lastReelIdx, setLastReelIdx] = useState(() => {
        const saved = localStorage.getItem('verbvibe_last_reel_idx');

      const [selectedTense, setSelectedTense] = useState('base');
      const [isSpeaking, setIsSpeaking] = useState(false);

      const [voicePitch, setVoicePitch] = useState(() => {
        try {
          const p = localStorage.getItem('verbvibe_voice_pitch');
          return p !== null ? parseFloat(p) : 1.1;
        } catch(e) { return 1.1; }

      const [voiceRate, setVoiceRate] = useState(() => {
        try {

      const [availableVoices, setAvailableVoices] = useState([]);

        try {

                        localStorage.getItem('verbvibe_voice_name') ||

          if (saved) return saved;
          const defVoice = getActiveVoice();
          return defVoice ? (defVoice.voiceURI || defVoice.name) : '';
        } catch(e) { return ''; }

      const handleVoicePitchChange = (p) => {
        setVoicePitch(p);
        try { localStorage.setItem('verbvibe_voice_pitch', p.toString()); } catch(e) {}
      };

      const handleVoiceRateChange = (r) => {
        setVoiceRate(r);
        try { localStorage.setItem('verbvibe_voice_rate', r.toString()); } catch(e) {}
      };

      const handleVoiceURIChange = (uri) => {
        setSelectedVoiceURI(uri);
        try { 
          localStorage.setItem('verbvibe_selected_voice', uri); 
          localStorage.setItem('verbvibe_voice', uri);
          localStorage.setItem('verbvibe_voice_name', uri);
        } catch(e) {}
      };

      // Dynamic Streak State with Missed Day Detection
      const [streak, setStreak] = useState(1);
      const [isPracticedToday, setIsPracticedToday] = useState(false);

      // Persistent Achievement Stats State
      const [trophyStats, setTrophyStats] = useState(() => {
        try {
          const saved = JSON.parse(localStorage.getItem('verbvibe_trophy_stats'));
          return {
            reelsViewed: 1,
            audioPlayed: 0,
            tensesSwitched: 0,
            questsCompleted: 0,
            accentChanged: 0,
            ...(saved || {})
          };
        } catch {
          return { reelsViewed: 1, audioPlayed: 0, tensesSwitched: 0, questsCompleted: 0, accentChanged: 0 };
        }
      });

      useEffect(() => {
        try {
          localStorage.setItem('verbvibe_trophy_stats', JSON.stringify(trophyStats));
        } catch(e) {}
      }, [trophyStats]);

      const trackTrophyAction = (key, amount = 1) => {
        setTrophyStats(prev => ({
          ...prev,
          [key]: (prev[key] || 0) + amount
        }));
      };

      // Persistent SRS / Mastery State for Verb Vault
      const [vaultProgress, setVaultProgress] = useState(() => {
        try {
          return JSON.parse(localStorage.getItem('verbvibe_vault_progress')) || {};
        } catch {
          return {};
        }
      });

      useEffect(() => {
        try {
          localStorage.setItem('verbvibe_vault_progress', JSON.stringify(vaultProgress));
        } catch(e) {}
      }, [vaultProgress]);

      const markVerbPracticingIfNew = (verbId) => {
        if (!verbId) return;
        setVaultProgress(prev => {
          if (prev[verbId]) return prev;
          return {
            ...prev,
            [verbId]: {
              status: 'practicing',
              nextReview: Date.now() + 24 * 60 * 60 * 1000
            }
          };
        });
      };

      const prevReelIdxRef = useRef(lastReelIdx);
      useEffect(() => {
        if (prevReelIdxRef.current !== lastReelIdx) {
          prevReelIdxRef.current = lastReelIdx;
          trackTrophyAction('reelsViewed');
        }
        if (activeTab === 'reels' && ACTION_VERBS[lastReelIdx]) {
          markVerbPracticingIfNew(ACTION_VERBS[lastReelIdx].id);
        }
      }, [lastReelIdx, activeTab]);

      const [savedVerbIds, setSavedVerbIds] = useState(() => {
        try {
          const s = localStorage.getItem('verbvibe_saved_verbs');
          return s ? JSON.parse(s) : {};
        } catch(e) { return {}; }
      });

      const [xp, setXp] = useState(() => {
        try {
          const isInitialized = localStorage.getItem('verbvibe_xp_earned_mode');
          if (!isInitialized) {
            localStorage.setItem('verbvibe_xp_earned_mode', 'true');
            localStorage.setItem('verbvibe_xp', '0');
            return 0;
          }
          const x = localStorage.getItem('verbvibe_xp');
          return x !== null ? parseInt(x, 10) : 0;
        } catch(e) { return 0; }
      });



      // Automatically award tiered XP once when any Trophy is completed
      useEffect(() => {
        const TROPHY_RULES = [
          { id: 'first_step', title: 'First Action', target: 1, statKey: 'reelsViewed', xp: 10 },
          { id: 'accent_explorer', title: 'Accent Explorer', target: 1, statKey: 'accentChanged', xp: 15 },
          { id: 'quest_starter', title: 'Quest Hunter', target: 1, statKey: 'questsCompleted', xp: 20 },
          { id: 'sharp_ears', title: 'Sharp Ears', target: 10, statKey: 'audioPlayed', xp: 20 },
          { id: 'tense_shifter', title: 'Tense Shifter', target: 10, statKey: 'tensesSwitched', xp: 20 },
          { id: 'knowit_starter', title: 'Brain Locker', target: 5, statKey: 'knowItCount', xp: 25 },
          { id: 'knowit_master', title: 'Memory Champion', target: 25, statKey: 'knowItCount', xp: 75 },
          { id: 'deck_collector', title: 'Deck Collector', target: 5, statKey: 'savedCount', xp: 25 },
          { id: 'reel_explorer', title: 'Reel Explorer', target: 15, statKey: 'reelsViewed', xp: 30 },
          { id: 'streak_keeper', title: 'Consistent Learner', target: 3, statKey: 'streak', xp: 40 },
          { id: 'time_traveler', title: 'Time Traveler', target: 30, statKey: 'tensesSwitched', xp: 50 },
          { id: 'polyglot_ear', title: 'Audio Enthusiast', target: 35, statKey: 'audioPlayed', xp: 50 },
          { id: 'deck_curator', title: 'Master Curator', target: 20, statKey: 'savedCount', xp: 60 },
          { id: 'quest_veteran', title: 'Quest Veteran', target: 5, statKey: 'questsCompleted', xp: 75 },
          { id: 'action_master', title: 'Action Addict', target: 50, statKey: 'reelsViewed', xp: 80 },
          { id: 'xp_champion', title: 'XP Champion', target: 250, statKey: 'xp', xp: 80 },
          { id: 'grammar_guru', title: 'Grammar Guru', target: 75, statKey: 'tensesSwitched', xp: 100 },
          { id: 'half_library', title: 'Vault Architect', target: 40, statKey: 'savedCount', xp: 110 },
          { id: 'sound_virtuoso', title: 'Sound Virtuoso', target: 100, statKey: 'audioPlayed', xp: 120 },
          { id: 'full_roster', title: 'Verb Completionist', target: 82, statKey: 'reelsViewed', xp: 150 },
          { id: 'xp_legend', title: 'XP Legend', target: 500, statKey: 'xp', xp: 150 },
          { id: 'xp_grandmaster', title: 'VerbVibe Grandmaster', target: 1000, statKey: 'xp', xp: 250 },
          { id: 'xp_prestige', title: 'Prestige Ascendant', target: 2000, statKey: 'xp', xp: 400 },
          { id: 'xp_immortal', title: 'Immortal Linguist', target: 3500, statKey: 'xp', xp: 600 },
        ];

        let claimed = {};
        try { claimed = JSON.parse(localStorage.getItem('verbvibe_claimed_trophies') || '{}'); } catch(e) {}

        const savedCountNow = Object.keys(savedVerbIds || {}).filter(id => !!savedVerbIds[id]).length;
        const knowItCountNow = Object.keys(vaultProgress || {}).filter(id => vaultProgress[id]?.status === 'mastered').length;
        let bonusXp = 0;
        let lastTitle = '';

        TROPHY_RULES.forEach(t => {
          if (claimed[t.id]) return;
          const val = t.statKey === 'savedCount' ? savedCountNow
                    : t.statKey === 'knowItCount' ? knowItCountNow
                    : t.statKey === 'xp' ? xp
                    : t.statKey === 'streak' ? (streak || 1)
                    : (trophyStats[t.statKey] || 0);
          if (val >= t.target) {
            claimed[t.id] = true;
            bonusXp += t.xp;
            lastTitle = t.title;
          }
        });

        if (bonusXp > 0) {
          try { localStorage.setItem('verbvibe_claimed_trophies', JSON.stringify(claimed)); } catch(e) {}
          setXp(prev => prev + bonusXp);
          try { sfx.playGoalChime(); } catch(e) {}
          if (typeof showToast === 'function') {
            showToast(`${lastTitle} Unlocked! +${bonusXp} XP`);
          }
        }
      }, [trophyStats, savedVerbIds, streak, xp]);

      // Ensure all claimed "Know It!" (+10 XP) verbs are reflected in total XP & Trophies progress bar
      useEffect(() => {
        try {
          const claimedKnowIt = JSON.parse(localStorage.getItem('verbvibe_knowit_xp_claimed') || '{}');
          const creditedKnowIt = JSON.parse(localStorage.getItem('verbvibe_knowit_xp_credited') || '{}');
          let uncreditedCount = 0;
          Object.keys(claimedKnowIt).forEach(id => {
            if (claimedKnowIt[id] && !creditedKnowIt[id]) {
              creditedKnowIt[id] = true;
              uncreditedCount++;
            }
          });
          if (uncreditedCount > 0) {
            localStorage.setItem('verbvibe_knowit_xp_credited', JSON.stringify(creditedKnowIt));
            setXp(prev => prev + uncreditedCount * 10);
          }
        } catch(e) {}
      }, [vaultProgress]);

      // Sync XP to localStorage whenever it changes
      useEffect(() => {
        try { localStorage.setItem('verbvibe_xp', xp.toString()); } catch(e) {}
      }, [xp]);
const [playerName, setPlayerName] = useState(() => {
        try {
          const saved = localStorage.getItem('verbvibe_player_name');
          return (saved && saved.trim()) ? saved.trim() : 'Learner';
        } catch(e) { return 'Learner'; }
      });

      const [isSettingsOpen, setIsSettingsOpen] = useState(false);
      const [toastMsg, setToastMsg] = useState(null);
      const speechTimerRef = useRef(null);

      // Check and update dynamic streak based on dates
      useEffect(() => {
        try {
          const todayStr = new Date().toISOString().slice(0, 10); // "YYYY-MM-DD"
          const lastDateStr = localStorage.getItem('verbvibe_last_active_date');
          const savedStreakStr = localStorage.getItem('verbvibe_streak');
          const savedStreak = savedStreakStr ? parseInt(savedStreakStr, 10) : 1;

          if (!lastDateStr) {
            localStorage.setItem('verbvibe_last_active_date', todayStr);
            localStorage.setItem('verbvibe_streak', '1');
            setStreak(1);
            setIsPracticedToday(true);
            return;
          }

          const today = new Date(todayStr);
          const last = new Date(lastDateStr);
          const diffDays = Math.floor((today - last) / (1000 * 60 * 60 * 24));

          if (diffDays === 0) {
            setStreak(savedStreak);
            setIsPracticedToday(true);
          } else if (diffDays === 1) {
            setStreak(savedStreak);
            setIsPracticedToday(false);
          } else {
            // Missed a day -> reset to 0!
            localStorage.setItem('verbvibe_streak', '0');
            setStreak(0);
            setIsPracticedToday(false);
          }
        } catch(e) {
          setStreak(1);
          setIsPracticedToday(true);
        }
      }, []);

      // Complete Daily Practice
      const doDailyPractice = () => {
        const todayStr = new Date().toISOString().slice(0, 10);
        const newStreak = streak === 0 ? 1 : streak + 1;
        setStreak(newStreak);
        setIsPracticedToday(true);
        setXp(prev => prev + 25);
        trackTrophyAction('questsCompleted', 1);
        try {
          localStorage.setItem('verbvibe_last_active_date', todayStr);
          localStorage.setItem('verbvibe_streak', newStreak.toString());
        } catch(e){}
        sfx.playGoalChime();
        showToast(`Streak Extended to ${newStreak} Days! +25 XP`);
