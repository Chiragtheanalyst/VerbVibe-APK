      useEffect(() => {
        try { localStorage.setItem('verbvibe_saved_verbs', JSON.stringify(savedVerbIds)); } catch(e){}
      }, [savedVerbIds]);

      // Helper: get effective SpeechSynthesisVoice
      const getEffectiveVoice = (targetURI) => {
        if (!('speechSynthesis' in window)) return null;
        const uriToFind = targetURI || selectedVoiceURI;
        const liveVoices = window.speechSynthesis.getVoices();
        const list = (liveVoices && liveVoices.length > 0) ? liveVoices : availableVoices;
        if (!list || list.length === 0) return null;
        if (uriToFind) {
          const match = list.find(v => (v.voiceURI && v.voiceURI === uriToFind) || v.name === uriToFind);
          if (match) return match;
        }
        // Check for Indian English voice
        const inVoice = list.find(v => (v.lang && v.lang.toLowerCase().replace('_', '-').startsWith('en-in')) || v.name.toLowerCase().includes('india') || v.name.toLowerCase().includes('ravi') || v.name.toLowerCase().includes('heera'));
        if (inVoice) return inVoice;
        // Prioritize smooth English voices
        const msVoice = list.find(v => v.name.toLowerCase().includes('microsoft') && v.lang.toLowerCase().startsWith('en'));
        if (msVoice) return msVoice;
        return list.find(v => v.lang && v.lang.toLowerCase().replace('_', '-').startsWith('en')) || list[0];
      };

      // Populate speech voices
      useEffect(() => {
        if (!('speechSynthesis' in window)) return;
        const loadVoices = () => {
          const all = window.speechSynthesis.getVoices();
          // Keep all voices, filtering for English ones in dropdown
          if (all && all.length > 0) {
            setAvailableVoices(all);
            setSelectedVoiceURI(prev => {
              if (prev && all.some(voice => (voice.voiceURI && voice.voiceURI === prev) || voice.name === prev)) {
                return prev;
              }
              const saved = localStorage.getItem('verbvibe_voice') || 
                            localStorage.getItem('verbvibe_voice_name') || 
                            localStorage.getItem('verbvibe_selected_voice');
              if (saved && all.some(voice => (voice.voiceURI && voice.voiceURI === saved) || voice.name === saved)) {
                return saved;
              }
              // If localStorage has no saved voice yet, find the default en-IN voice using getActiveVoice()
              const defaultVoice = getActiveVoice();
              const defaultUri = defaultVoice ? (defaultVoice.voiceURI || defaultVoice.name) : '';
              if (defaultUri) {
                try { 
                  localStorage.setItem('verbvibe_selected_voice', defaultUri);
                  localStorage.setItem('verbvibe_voice', defaultUri);
                  localStorage.setItem('verbvibe_voice_name', defaultUri);
                } catch(e) {}
              }
              return defaultUri;
            });
          }
        };

        loadVoices();
        if (window.speechSynthesis.onvoiceschanged !== undefined) {
          window.speechSynthesis.onvoiceschanged = loadVoices;
        }
        const timer1 = setTimeout(loadVoices, 250);
        const timer2 = setTimeout(loadVoices, 800);
        return () => {
          clearTimeout(timer1);
          clearTimeout(timer2);
        };
      }, []);
      // Show toast
      const showToast = (msg) => {
        setToastMsg(msg);
        setTimeout(() => setToastMsg(null), 2500);
      };

      // Toggle Bookmark
      const toggleBookmark = (id) => {
        sfx.playBlip(720);
        setSavedVerbIds(prev => {
          const isAdding = !prev[id];
          if (isAdding) markVerbPracticingIfNew(id);
          const next = { ...prev, [id]: isAdding };
          return next;
        });
      };

      // Instant Voice Test preview
      const testVoice = (targetURI) => {
        if (!('speechSynthesis' in window)) {
          showToast('Speech synthesis not available in this browser');
          return;
        }
        if (window.speechSynthesis.paused) {
          window.speechSynthesis.resume();
        }
        window.speechSynthesis.cancel();
        sfx.playBlip(540);

        const voice = getActiveVoice(targetURI);
        const samplePhrases = [
          "Hello! Let's master action verbs with VerbVibe!",
          "Great accent! Ready to explore and level up?",
          "Awesome! Voice accent is working perfectly."
        ];
        const phrase = samplePhrases[Math.floor(Math.random() * samplePhrases.length)];
        const utterance = new SpeechSynthesisUtterance(phrase);
        utterance.rate = voiceRate;
        utterance.pitch = voicePitch;

        if (voice) {
          utterance.voice = voice;
          utterance.lang = voice.lang;
        } else {
          utterance.lang = 'en-IN';
        }

        utterance.onstart = () => setIsSpeaking(true);
        utterance.onend = () => setIsSpeaking(false);
        utterance.onerror = () => setIsSpeaking(false);

        window.speechSynthesis.speak(utterance);
      };

      // Speak Single Word
      const speakWord = (customWord) => {
        if (isMuted) return;
        const activeVerb = ACTION_VERBS[lastReelIdx];
        const wordToSpeak = (typeof customWord === 'string' && customWord) ? customWord : (activeVerb ? (activeVerb.forms[selectedTense] || activeVerb.forms.base || activeVerb.verb) : '');
        speakCustom(wordToSpeak);
      };

      const speakCustom = (text) => {
        if (isMuted || !('speechSynthesis' in window)) return;
        trackTrophyAction('audioPlayed');
        if (window.speechSynthesis.paused) {
          window.speechSynthesis.resume();
        }
        window.speechSynthesis.cancel();
        sfx.playBlip(480);

        const utterance = new SpeechSynthesisUtterance(text);
        utterance.rate = voiceRate;
        utterance.pitch = voicePitch;

        const voice = getActiveVoice();
        if (voice) {
          utterance.voice = voice;
          utterance.lang = voice.lang;
        } else {
          utterance.lang = 'en-IN';
        }

        utterance.onstart = () => setIsSpeaking(true);
        utterance.onend = () => setIsSpeaking(false);
        utterance.onerror = () => setIsSpeaking(false);

        window.speechSynthesis.speak(utterance);
      };

      // Speak Full Sentence with Jitter-Free Monotonic Word Boundary Highlighting
      const speakSentence = () => {
        if (isMuted || !('speechSynthesis' in window)) return;
        if (window.speechSynthesis.paused) {
          window.speechSynthesis.resume();
        }
        window.speechSynthesis.cancel();
        if (speechTimerRef.current) clearInterval(speechTimerRef.current);

        const activeVerb = ACTION_VERBS[lastReelIdx];
        const sentence = activeVerb.sentences[selectedTense] || activeVerb.sentences.base;
        const words = sentence.split(' ');

        const utterance = new SpeechSynthesisUtterance(sentence);
        utterance.rate = voiceRate;
        utterance.pitch = voicePitch;

        const voice = getActiveVoice();
        if (voice) {
          utterance.voice = voice;
          utterance.lang = voice.lang;
        } else {
          utterance.lang = 'en-IN';
        }

        let hasBoundarySupport = false;
        let lastHighlightIdx = 0;

        utterance.onstart = () => {
          setIsSpeaking(true);
          setHighlightedWordIdx(0);
          lastHighlightIdx = 0;

          // Fallback interval highlighter only if onboundary is not supported
          const msPerWord = Math.max(260, Math.floor(500 / voiceRate));
          let timerCounter = 0;
          speechTimerRef.current = setInterval(() => {
            if (hasBoundarySupport) {
              clearInterval(speechTimerRef.current);
              return;
            }
            timerCounter++;
            if (timerCounter < words.length) {
              lastHighlightIdx = timerCounter;
              setHighlightedWordIdx(timerCounter);
            } else {
              clearInterval(speechTimerRef.current);
            }
          }, msPerWord);
        };

        // Monotonic real-time boundary (NEVER jumps backwards!)
        utterance.onboundary = (e) => {
          if (e.name === 'word') {
            hasBoundarySupport = true;
            if (speechTimerRef.current) {
              clearInterval(speechTimerRef.current);
              speechTimerRef.current = null;
            }

            const charIdx = e.charIndex;
            let count = 0;
            let foundIdx = 0;
            for (let i = 0; i < words.length; i++) {
              if (charIdx >= count && charIdx <= count + words[i].length) {
                foundIdx = i;
                break;
              }
              count += words[i].length + 1;
            }

            // Only advance forward to prevent jitter
            if (foundIdx >= lastHighlightIdx) {
              lastHighlightIdx = foundIdx;
              setHighlightedWordIdx(foundIdx);
            }
          }
        };

        utterance.onend = () => {
          setIsSpeaking(false);
          setHighlightedWordIdx(null);
          if (speechTimerRef.current) clearInterval(speechTimerRef.current);
        };

        utterance.onerror = () => {
          setIsSpeaking(false);
          setHighlightedWordIdx(null);
          if (speechTimerRef.current) clearInterval(speechTimerRef.current);
        };

        window.speechSynthesis.speak(utterance);
      };
      // Tab switcher with voice cutoff
      const handleTabSwitch = (tabKey) => {
        if (tabKey === activeTab) return;
        sfx.playWhoosh();
        if ('speechSynthesis' in window) {
          window.speechSynthesis.cancel();
        }
        setIsSpeaking(false);
        setActiveTab(tabKey);
      };

      return (
        <div className="w-full h-full flex flex-col items-center justify-center bg-black overflow-hidden font-outfit">
          
          {/* Toast Notification */}
          {toastMsg && (
            <div className="fixed top-14 left-1/2 -translate-x-1/2 z-50 pointer-events-none transition-all flex items-center gap-2 px-4 py-2 rounded-full glass-hud shadow-sm text-xs font-bold text-white border border-arcade-cyan/40 animate-bounce">
              <Icon name="sparkles" size={16} color="#F59E0B"/>
              <span>{toastMsg}</span>
            </div>
          )}

          {/* Centered Mobile Frame Viewport */}
          <div className="relative w-full h-full md:max-w-[420px] md:h-[94vh] md:rounded-[40px] md:border md:border-white/15 md:shadow-[0_25px_70px_rgba(0,0,0,0.85)] flex flex-col bg-arcade-deep overflow-hidden">
            
            {/* Desktop Speaker Notch */}
            <div className="hidden md:flex absolute top-2 inset-x-0 justify-center z-40 pointer-events-none">
              <div className="w-20 h-3.5 bg-black/80 rounded-full border border-white/10 flex items-center justify-center">
                <div className="w-7 h-1 rounded-full bg-white/20"></div>
              </div>
            </div>

            {/* TOP BAR (SOLID, SLEEK, ZERO CLIPPING) */}
            <header className="flex-shrink-0 z-30 h-14 px-4 bg-[#0a0e1f] border-b border-white/10 flex items-center justify-between shadow-md">
              <div className="flex items-center gap-2">
                <img 
                  src="./assets/logo.png" 
                  alt="VerbVibe Logo" 
                  className="w-8 h-8 rounded-lg shadow-md object-contain"
                />
                <h1 className="text-base font-black tracking-tight text-white flex items-center">
                  Verb<span className="text-arcade-cyan">Vibe</span>
                </h1>
              </div>

              <div className="flex items-center gap-1.5">
                {/* Dynamic Streak Badge */}
                <div className="flex items-center gap-1 px-2.5 py-1 rounded-full glass-pill text-xs font-bold text-arcade-pink">
                  <Icon name="flame" size={13} color="#FF1744"/>
                  <span>{streak}</span>
                </div>

                {/* Total XP Badge */}
                <div className="flex items-center gap-1 px-2.5 py-1 rounded-full glass-pill text-xs font-bold text-arcade-emerald">
                  <svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
                  <span className="font-mono">{xp}</span>
                </div>

                {/* Mute Toggle */}
                <button 
                  onClick={() => {
                    setIsMuted(!isMuted);
                    sfx.playBlip(isMuted ? 660 : 300);
                    showToast(isMuted ? 'Audio Unmuted' : 'Audio Muted');
                  }}
                  className="w-8 h-8 rounded-full glass-pill flex items-center justify-center text-arcade-cyan hover:border-arcade-cyan transition-all"
                  title="Toggle Mute"
                >
                  <Icon name={isMuted ? 'volumeX' : 'volume'} size={15}/>
                </button>

                {/* Settings Gear */}
                <button 
                  onClick={() => {
                    sfx.playBlip(540);
                    setIsSettingsOpen(true);
                  }}
                  className="w-8 h-8 rounded-full glass-pill flex items-center justify-center text-slate-300 hover:text-white transition-all"
                  title="Settings"
                >
                  <Icon name="settings" size={15}/>
                </button>
              </div>
            </header>

            {/* SCREEN VIEWPORT CONTAINER */}
            <main className="flex-1 min-h-0 w-full relative overflow-hidden flex flex-col">
              <div className={`w-full h-full ${activeTab === 'reels' ? 'block' : 'hidden'}`}>
                <ReelsTab 
                  activeTab={activeTab}
                  verbs={ACTION_VERBS}
                  activeReelIdx={lastReelIdx}
                  setActiveReelIdx={setLastReelIdx}
                  selectedTense={selectedTense}
                  setSelectedTense={setSelectedTense}
                  isSpeaking={isSpeaking}
                  highlightedWordIdx={highlightedWordIdx}
                  speakWord={speakWord}
                  speakSentence={speakSentence}
                  savedVerbIds={savedVerbIds}
                  toggleBookmark={toggleBookmark}
                  trackTrophyAction={trackTrophyAction}
                  onPracticeClick={() => {
                    handleTabSwitch('quests');
                    showToast('Take today\'s practice challenge!');
                  }}
                />
              </div>

              {activeTab === 'deck' && (
                <DeckTab 
                  verbs={ACTION_VERBS}
                  savedVerbIds={savedVerbIds}
                  toggleBookmark={toggleBookmark}
                  speakWordCustom={speakCustom}
                  setXp={setXp}
                  showToast={showToast}
                  vaultProgress={vaultProgress}
                  setVaultProgress={setVaultProgress}
                  onHeroReviewInReel={(verbIdx) => {
                    setLastReelIdx(verbIdx);
                    handleTabSwitch('reels');
                  }}
                />
              )}

              {activeTab === 'quests' && (
                <QuestsTab 
                  xp={xp}
                  setXp={setXp}
                  streak={streak}
                  isPracticedToday={isPracticedToday}
                  doDailyPractice={doDailyPractice}
                  trackTrophyAction={trackTrophyAction}
                />
              )}

              {activeTab === 'trophies' && (
                <TrophiesTab 
                  xp={xp}
                  streak={streak}
                  playerName={playerName}
                  setPlayerName={setPlayerName}
                  trophyStats={trophyStats}
                  savedVerbIds={savedVerbIds} 
                  vaultProgress={vaultProgress}
                />
              )}
            </main>

            {/* BOTTOM DOCK NAVIGATION BAR */}
            <nav className="flex-shrink-0 z-40 h-[72px] glass-dock px-3 flex items-center justify-around border-t border-white/10">
              {[
                { key: 'reels', label: 'Reels', icon: 'reels', color: '#F59E0B' },
                { key: 'deck', label: 'Deck', icon: 'deck', color: '#F59E0B' },
                { key: 'quests', label: 'Quests', icon: 'quests', color: '#F59E0B' },
                { key: 'trophies', label: 'Trophies', icon: 'trophies', color: '#F59E0B' },
              ].map(tab => {
                const isActive = activeTab === tab.key;
                return (
                  <button
                    key={tab.key}
                    onClick={() => handleTabSwitch(tab.key)}
                    className="flex flex-col items-center justify-center flex-1 py-1 group active:scale-95 transition-all focus:outline-none"
                  >
                    <div 
                      className={`relative w-10 h-10 rounded-2xl flex items-center justify-center transition-all duration-200 ${
                        isActive 
                          ? 'shadow-sm -translate-y-0.5' 
                          : 'hover:bg-white/5'
                      }`}
                      style={{
                        backgroundColor: isActive ? tab.color : 'transparent',
                      }}
                    >
                      <Icon 
                        name={tab.icon} 
                        size={20} 
                        color={isActive ? '#060814' : '#8f9bbb'}
                      />
                    </div>
                    <span 
                      className={`text-[10px] font-bold tracking-tight mt-0.5 transition-colors ${
                        isActive ? 'text-white' : 'text-slate-400'
                      }`}
                    >
                      {tab.label}
                    </span>
                  </button>
                );
              })}
            </nav>

            {/* SETTINGS DRAWER MODAL */}
            {isSettingsOpen && (
              <div className="absolute inset-0 z-50 flex items-end sm:items-center justify-center">
                <div onClick={() => setIsSettingsOpen(false)} className="absolute inset-0 bg-black/80 backdrop-blur-sm"></div>
                <div className="relative w-full glass-hud rounded-t-3xl sm:rounded-3xl p-5 flex flex-col gap-4 border border-arcade-cyan/30 shadow-2xl z-10 max-h-[85vh] overflow-y-auto">
                  <div className="flex items-center justify-between pb-2 border-b border-white/10">
                    <h3 className="text-sm font-bold text-white flex items-center gap-2">
                      <Icon name="settings" size={16} color="#F59E0B"/>
                      <span>Audio & Voice Settings</span>
                    </h3>
                    <button onClick={() => setIsSettingsOpen(false)} className="w-7 h-7 rounded-full glass-pill flex items-center justify-center text-slate-300">
                      <Icon name="x" size={14}/>
                    </button>
                  </div>

                  {/* Speech Rate Slider */}
                  <div className="space-y-1">
                    <div className="flex justify-between text-xs text-slate-300">
                      <span>Speech Speed (Kid-Friendly Cadence)</span>
                      <span className="font-mono text-arcade-cyan font-bold">{voiceRate}x</span>
                    </div>
                    <input 
                      type="range" 
                      min="0.5" 
                      max="1.5" 
                      step="0.05"
                      value={voiceRate}
                      onChange={(e) => handleVoiceRateChange(parseFloat(e.target.value))}
                      className="w-full accent-arcade-cyan"
                    />
                  </div>

                  {/* Pitch Slider */}
                  <div className="space-y-1">
                    <div className="flex justify-between text-xs text-slate-300">
                      <span>Voice Pitch (Cheerfulness)</span>
                      <span className="font-mono text-arcade-emerald font-bold">{voicePitch}x</span>
                    </div>
                    <input 
                      type="range" 
                      min="0.8" 
                      max="1.6" 
                      step="0.05"
                      value={voicePitch}
                      onChange={(e) => handleVoicePitchChange(parseFloat(e.target.value))}
                      className="w-full accent-arcade-emerald"
                    />
                  </div>

                  {/* Voice Selector with Accent Testing */}
                  {availableVoices.length > 0 && (() => {
                    const englishVoices = availableVoices.filter(v => {
                      const lang = (v.lang || '').replace('_', '-').toLowerCase();
                      return lang === 'en-in' || lang === 'en-us' || lang === 'en-gb' || lang.startsWith('en');
                    });
                    const voicesToShow = englishVoices.length > 0 ? englishVoices : availableVoices;
                    
                    // If no voice is saved or selected yet, find the default en-IN voice using getActiveVoice()
                    const activeDefaultVoice = getActiveVoice();
                    const activeDefaultURI = activeDefaultVoice ? (activeDefaultVoice.voiceURI || activeDefaultVoice.name) : '';
                    const dropdownSelectedValue = (selectedVoiceURI && voicesToShow.some(v => (v.voiceURI || v.name) === selectedVoiceURI))
                      ? selectedVoiceURI
                      : activeDefaultURI;

                    const formatVoiceLabel = (v) => {
                      const lang = (v.lang || '').replace('_', '-').toLowerCase();
                      let region = 'English';
                      if (lang === 'en-in' || v.name.toLowerCase().includes('india') || v.name.toLowerCase().includes('ravi') || v.name.toLowerCase().includes('heera')) {
                        region = 'English (India)';
                      } else if (lang === 'en-us') {
                        region = 'English (US)';
                      } else if (lang === 'en-gb') {
                        region = 'English (UK)';
                      } else if (lang.startsWith('en-')) {
                        region = `English (${lang.split('-')[1].toUpperCase()})`;
                      }
                      return `${region} - ${v.name}`;
                    };
                    return (
                      <div className="space-y-1.5">
                        <div className="flex items-center justify-between">
                          <label className="text-xs text-slate-300 font-medium block">Synthesized Voice Accent</label>
                          <button 
                            type="button"
                            onClick={() => {
                              trackTrophyAction('accentChanged', 1);
                              testVoice(dropdownSelectedValue);
                            }}
                            className="px-2.5 py-1 rounded-lg bg-arcade-cyan/15 text-arcade-cyan text-[11px] font-bold border border-arcade-cyan/30 hover:bg-arcade-cyan/25 flex items-center gap-1.5 active:scale-95 transition-all shadow-sm"
                          >
                            <Icon name="volume" size={13} color="#F59E0B"/>
                            <span>Test Accent</span>
                          </button>
                        </div>
                        <select 
                          value={dropdownSelectedValue} 
                          onChange={(e) => {
                            const val = e.target.value;
                            localStorage.setItem('verbvibe_voice', val);
                            localStorage.setItem('verbvibe_voice_name', val);
                            localStorage.setItem('verbvibe_selected_voice', val);
                            handleVoiceURIChange(val);
                            trackTrophyAction('accentChanged', 1);
                            testVoice(val);
                          }}
                          className="w-full py-2.5 px-3 rounded-xl bg-arcade-card border border-white/10 text-xs text-white focus:outline-none focus:border-arcade-cyan font-medium"
                        >
                          {voicesToShow.map(v => {
                            const val = v.voiceURI || v.name;
                            return (
                              <option key={val} value={val} className="bg-[#0e1428] text-white py-1">
                                {formatVoiceLabel(v)}
                              </option>
                            );
                          })}
                        </select>
                      </div>
                    );
                  })()}

                  {/* Replay Onboarding Tour */}
                  <button
                    type="button"
                    onClick={() => {
                      sfx.playBlip(540);
                      setIsSettingsOpen(false);
                      setOnboardingStep(0);
                      setShowOnboarding(true);
                    }}
                    className="w-full py-2.5 rounded-xl bg-white/5 border border-white/10 text-xs font-bold text-arcade-cyan hover:bg-cyan-500/10 hover:border-cyan-400/30 transition-all flex items-center justify-center gap-1.5"
                  >
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true"><rect x="2" y="2" width="20" height="20" rx="2.18" ry="2.18"/><line x1="7" y1="2" x2="7" y2="22"/><line x1="17" y1="2" x2="17" y2="22"/><line x1="2" y1="12" x2="22" y2="12"/></svg>
                    <span>Replay App Intro Tour</span>
                  </button>

                  {/* Buttons */}
                  <div className="flex gap-2 pt-1">
                    <button 
                      onClick={() => {
                        handleVoiceRateChange(0.88);
                        handleVoicePitchChange(1.0);
                        const indianDefault = getActiveVoice();
                        const defaultUri = indianDefault ? (indianDefault.voiceURI || indianDefault.name) : '';
                        if (defaultUri) {
                          handleVoiceURIChange(defaultUri);
                          try {
                            localStorage.setItem('verbvibe_voice', defaultUri);
                            localStorage.setItem('verbvibe_voice_name', defaultUri);
                            localStorage.setItem('verbvibe_selected_voice', defaultUri);
                          } catch(e) {}
                        }
                        showToast('Reset to Indian English default!');
                        if (defaultUri) testVoice(defaultUri);
                      }}
                      className="flex-1 py-2.5 rounded-xl glass-pill text-xs font-bold text-slate-300 hover:text-white"
                    >
                      Reset Defaults
                    </button>
                    <button 
                      onClick={() => {
                        setIsSettingsOpen(false);
                        sfx.playGoalChime();
                        showToast('Voice settings saved!');
                      }}
                      className="flex-1 py-2.5 rounded-xl bg-arcade-cyan text-black text-xs font-black shadow-sm active:scale-95 transition-transform"
                    >
                      Save Settings
                    </button>
                  </div>
                </div>
              </div>
            )}
          </div>

          {/* Desktop Keyboard Quick Tip */}
          <div className="hidden md:flex items-center gap-2 mt-2 text-[11px] font-mono text-slate-400">
            <span>Use</span>
            <kbd className="px-1.5 py-0.5 rounded bg-white/10 text-arcade-cyan font-bold">Up</kbd>
            <kbd className="px-1.5 py-0.5 rounded bg-white/10 text-arcade-cyan font-bold">Down</kbd>
            <span>in Reels • Press</span>
            <kbd className="px-1.5 py-0.5 rounded bg-white/10 text-arcade-emerald font-bold">Space</kbd>
            <span>to read sentence</span>
          </div>

          {/* FIRST-TIME ONBOARDING WALKTHROUGH MODAL */}
          {showOnboarding && (() => {
            const slide = ONBOARDING_SLIDES[onboardingStep] || ONBOARDING_SLIDES[0];
            const isLast = onboardingStep >= ONBOARDING_SLIDES.length - 1;
            return (
              <div className="fixed inset-0 z-50 bg-slate-950/90 backdrop-blur-md flex items-center justify-center p-4">
                <div className="bg-[#0B0E1B] border border-cyan-500/30 rounded-3xl max-w-sm w-full p-6 text-center shadow-2xl">
                  {/* Top Row: Step Indicator Dots + Skip */}
                  <div className="flex items-center justify-between mb-6">
                    <div className="flex items-center gap-1.5">
                      {ONBOARDING_SLIDES.map((_, i) => (
                        <span
                          key={i}
                          className={`h-1.5 rounded-full transition-all duration-300 ${
                            i === onboardingStep
                              ? 'w-6 bg-cyan-400 shadow-sm'
                              : 'w-1.5 bg-slate-700'
                          }`}
                        />
                      ))}
                    </div>
                    <button
                      type="button"
                      onClick={() => {
                        sfx.playBlip(480);
                        completeOnboarding();
                      }}
                      className="text-xs font-semibold text-slate-400 hover:text-white transition-colors px-2 py-1"
                    >
                      Skip
                    </button>
                  </div>

                  {/* Visual Centerpiece */}
                  {slide.icon === 'logo' ? (
                    <img
                      src="./assets/logo.png"
                      alt="VerbVibe"
                      className="w-16 h-16 mx-auto rounded-2xl shadow-lg mb-4 object-contain"
                    />
                  ) : (
                    <div className="w-16 h-16 mx-auto rounded-2xl bg-cyan-500/10 border border-cyan-400/30 flex items-center justify-center text-3xl mb-4 shadow-sm">
                      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#38BDF8" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true"><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"/><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"/><path d="M4 22h16"/><path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"/><path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"/><path d="M18 2H6v7a6 6 0 0 0 12 0V2Z"/></svg>
                    </div>
                  )}

                  {/* Badge, Title, Description & Highlight */}
                  <div className="text-xs font-semibold uppercase tracking-wider text-cyan-400 mb-1">
                    {slide.badge}
                  </div>
                  <h2 className="text-xl font-bold text-white mb-2">
                    {slide.title}
                  </h2>
                  <p className="text-sm text-slate-300 leading-relaxed mb-4">
                    {slide.desc}
                  </p>
                  <div className="inline-block px-3.5 py-1.5 rounded-full bg-cyan-500/10 border border-cyan-400/30 text-xs font-semibold text-cyan-300 mb-6">
                    {slide.highlight}
                  </div>

                  {/* Bottom Navigation Buttons */}
                  <div className="flex items-center gap-2.5">
                    {onboardingStep > 0 && (
                      <button
                        type="button"
                        onClick={() => {
                          sfx.playBlip(460);
                          setOnboardingStep(s => Math.max(0, s - 1));
                        }}
                        className="flex-1 py-3 rounded-2xl bg-slate-800/80 border border-white/10 text-xs font-bold text-slate-200 hover:bg-slate-700/80 transition-all active:scale-95"
                      >
                        Back
                      </button>
                    )}
                    <button
                      type="button"
                      onClick={() => {
                        if (isLast) {
                          sfx.playGoalChime();
                          completeOnboarding();
                        } else {
                          sfx.playBlip(600);
                          setOnboardingStep(s => s + 1);
                        }
                      }}
                      className="flex-1 py-3 rounded-2xl bg-gradient-to-r from-cyan-400 to-emerald-400 text-slate-950 text-xs font-black shadow-sm hover:brightness-110 transition-all active:scale-95"
                    >
                      {isLast ? 'Start Learning' : 'Next →'}
                    </button>
                  </div>
                </div>
              </div>
            );
          })()}

        </div>
      );

    // Render Root

<script id="reel-loop-fix">
(function() {
  function findReelScroller() {
    const candidates = Array.from(document.querySelectorAll('div, main, section'));
    return candidates.find(el => {
      const style = window.getComputedStyle(el);
      const scrollable = (style.overflowY === 'scroll' || style.overflowY === 'auto');
      return scrollable && el.scrollHeight > el.clientHeight + 100 && el.offsetParent !== null;
    });
  }

  let startY = 0;
  let startedAtBottom = false;

  document.addEventListener('touchstart', function(e) {
    const scroller = findReelScroller();
    if (!scroller || !e.touches || !e.touches.length) return;
    startY = e.touches[0].clientY;
    startedAtBottom = (scroller.scrollTop + scroller.clientHeight >= scroller.scrollHeight - 15);
  }, { passive: true });

  document.addEventListener('touchend', function(e) {
    const scroller = findReelScroller();
    if (!scroller || !startedAtBottom || !e.changedTouches || !e.changedTouches.length) return;
    const endY = e.changedTouches[0].clientY;
    const swipedUp = (startY - endY) > 45;
    const stillAtBottom = (scroller.scrollTop + scroller.clientHeight >= scroller.scrollHeight - 15);
    if (swipedUp && stillAtBottom) {
      scroller.scrollTo({ top: 0, behavior: 'smooth' });
    }
    startedAtBottom = false;
  }, { passive: true });

  let wheelLock = false;
  document.addEventListener('wheel', function(e) {
    const scroller = findReelScroller();
    if (!scroller || wheelLock) return;
    const atBottom = (scroller.scrollTop + scroller.clientHeight >= scroller.scrollHeight - 15);
    if (atBottom && e.deltaY > 25) {
      wheelLock = true;
      scroller.scrollTo({ top: 0, behavior: 'smooth' });
      setTimeout(() => { wheelLock = false; }, 700);
    }
  }, { passive: true });
})();
</script>

<script id="vault-tenses-addon">

    imagine: ['imagines', 'imagined', 'imagined', 'imagining'],
    investigate: ['investigates', 'investigated', 'investigated', 'investigating'],
    jump: ['jumps', 'jumped', 'jumped', 'jumping'],
    kick: ['kicks', 'kicked', 'kicked', 'kicking'],
    laugh: ['laughs', 'laughed', 'laughed', 'laughing'],
    leap: ['leaps', 'leapt', 'leapt', 'leaping'],
    listen: ['listens', 'listened', 'listened', 'listening'],
    look: ['looks', 'looked', 'looked', 'looking'],
    maneuver: ['maneuvers', 'maneuvered', 'maneuvered', 'maneuvering'],
    measure: ['measures', 'measured', 'measured', 'measuring'],
    mix: ['mixes', 'mixed', 'mixed', 'mixing'],
    navigate: ['navigates', 'navigated', 'navigated', 'navigating'],
    observe: ['observes', 'observed', 'observed', 'observing'],
    open: ['opens', 'opened', 'opened', 'opening'],

    protect: ['protects', 'protected', 'protected', 'protecting'],

    search: ['searches', 'searched', 'searched', 'searching'],
    sing: ['sings', 'sang', 'sung', 'singing'],
    sit: ['sits', 'sat', 'sat', 'sitting'],
    skate: ['skates', 'skated', 'skated', 'skating'],
    sleep: ['sleeps', 'slept', 'slept', 'sleeping'],
    slide: ['slides', 'slid', 'slid', 'sliding'],
    smile: ['smiles', 'smiled', 'smiled', 'smiling'],
    splash: ['splashes', 'splashed', 'splashed', 'splashing'],
    squeeze: ['squeezes', 'squeezed', 'squeezed', 'squeezing'],
    stand: ['stands', 'stood', 'stood', 'standing'],
    stretch: ['stretches', 'stretched', 'stretched', 'stretching'],
    swim: ['swims', 'swam', 'swum', 'swimming'],
    take: ['takes', 'took', 'taken', 'taking'],
    talk: ['talks', 'talked', 'talked', 'talking'],
    test: ['tests', 'tested', 'tested', 'testing'],
    throw: ['throws', 'threw', 'thrown', 'throwing'],
    transform: ['transforms', 'transformed', 'transformed', 'transforming'],
    walk: ['walks', 'walked', 'walked', 'walking'],
    wash: ['washes', 'washed', 'washed', 'washing'],
    whisper: ['whispers', 'whispered', 'whispered', 'whispering'],
    write: ['writes', 'wrote', 'written', 'writing']
  };

  function getOrderedReelVerbs() {
    const ordered = [];
    const seen = new Set();
    document.querySelectorAll('video[src], video source[src]').forEach(el => {
      const src = el.getAttribute('src') || '';
      const m = src.match(/\/([a-zA-Z]+)\.mp4/i);
      if (m) {
        const v = m[1].toLowerCase();
        if (!seen.has(v)) { seen.add(v); ordered.push(v); }
      }
    });
    if (ordered.length === 0) {
      const matches = document.documentElement.innerHTML.matchAll(/assets\/videos\/([a-zA-Z]+)\.mp4/gi);
      for (const m of matches) {
        const v = m[1].toLowerCase();
        if (!seen.has(v)) { seen.add(v); ordered.push(v); }
      }
    }
    return ordered.length > 0 ? ordered : Object.keys(VERB_FORMS);
  }

  function getForms(rawVerb) {
    const v = rawVerb.toLowerCase().trim();
    if (VERB_FORMS[v]) {
      const [v1s, v2, v3, ving] = VERB_FORMS[v];
      return { v1: v, v1s, v2, v3, ving };
    }
    const v1s = /[^aeiou]y$/.test(v) ? v.slice(0, -1) + 'ies' : (/(s|sh|ch|x|z|o)$/.test(v) ? v + 'es' : v + 's');
    const v2 = v.endsWith('e') ? v + 'd' : (/[^aeiou]y$/.test(v) ? v.slice(0, -1) + 'ied' : v + 'ed');
    const ving = v.endsWith('e') ? v.slice(0, -1) + 'ing' : v + 'ing';
    return { v1: v, v1s, v2, v3: v2, ving };
  }

  function build12Tenses(verb) {
    const f = getForms(verb);
    return [
      { group: 'Present Tenses', items: [
        { name: 'Simple Present', ex: 'I ' + f.v1 + ' / She ' + f.v1s },
        { name: 'Present Continuous', ex: 'I am ' + f.ving },
        { name: 'Present Perfect', ex: 'I have ' + f.v3 },
        { name: 'Present Perfect Continuous', ex: 'I have been ' + f.ving }
      ]},
      { group: 'Past Tenses', items: [
        { name: 'Simple Past', ex: 'I ' + f.v2 },
        { name: 'Past Continuous', ex: 'I was ' + f.ving },
        { name: 'Past Perfect', ex: 'I had ' + f.v3 },
        { name: 'Past Perfect Continuous', ex: 'I had been ' + f.ving }
      ]},
      { group: 'Future Tenses', items: [
        { name: 'Simple Future', ex: 'I will ' + f.v1 },
        { name: 'Future Continuous', ex: 'I will be ' + f.ving },
        { name: 'Future Perfect', ex: 'I will have ' + f.v3 },
        { name: 'Future Perfect Continuous', ex: 'I will have been ' + f.ving }
      ]}
    ];
  }

  function speakPhrase(text) {
    if (!window.speechSynthesis) return;
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text.replace('/', ','));
    u.lang = 'en-IN';
    u.rate = 0.85;
    window.speechSynthesis.speak(u);
  }

  function openTenseModal(initialVerb) {
    const old = document.getElementById('vv-tense-modal');
    if (old) old.remove();

    const reelVerbs = getOrderedReelVerbs();
    let currentVerb = (initialVerb || reelVerbs[0] || 'kick').toLowerCase();
    if (!reelVerbs.includes(currentVerb) && reelVerbs.length > 0) {
      currentVerb = reelVerbs[0];
    }

    const modal = document.createElement('div');
    modal.id = 'vv-tense-modal';
    modal.style.cssText = 'position:fixed;inset:0;z-index:99999;background:rgba(6,10,20,0.88);backdrop-filter:blur(8px);display:flex;align-items:center;justify-content:center;padding:14px;';

    function renderContent(verb) {
      const idx = reelVerbs.indexOf(verb);
      const groups = build12Tenses(verb);

      const pillsHtml = reelVerbs.map((rv, i) => {
        const active = rv === verb;
        return `<button data-pick="${rv}" style="flex:0 0 auto;padding:6px 12px;border-radius:999px;border:1px solid ${active ? '#F59E0B' : 'rgba(148,163,184,0.25)'};background:${active ? '#0284c7' : 'rgba(30,41,59,0.9)'};color:#fff;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.4px;cursor:pointer;">${i + 1}. ${rv}</button>`;
      }).join('');

      const sectionsHtml = groups.map(g => `
        <div style="margin-bottom:16px;">
          <div style="font-size:11px;font-weight:800;letter-spacing:1.2px;text-transform:uppercase;color:#F59E0B;margin:0 0 8px 2px;">${g.group}</div>
          <div style="display:flex;flex-direction:column;gap:8px;">
            ${g.items.map(t => `
              <div data-say="${t.ex}" style="display:flex;justify-content:space-between;align-items:center;background:rgba(30,41,59,0.75);border:1px solid rgba(148,163,184,0.16);border-radius:12px;padding:10px 14px;cursor:pointer;">
                <div>
                  <div style="font-size:11px;color:#94a3b8;margin-bottom:2px;">${t.name}</div>
                  <div style="font-size:15px;font-weight:600;color:#f8fafc;">${t.ex}</div>
                </div>
                <span style="display:inline-flex;align-items:center;color:#F59E0B;padding-left:10px;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/></svg></span>
              </div>
            `).join('')}
          </div>
        </div>
      `).join('');

      modal.innerHTML = `
        <div style="width:100%;max-width:460px;height:82vh;display:flex;flex-direction:column;overflow:hidden;background:#0f172a;border:1px solid rgba(56,189,248,0.35);border-radius:22px;color:#fff;box-shadow:0 24px 60px rgba(0,0,0,0.8);">
          <div style="flex:0 0 auto;background:#0f172a;padding:16px 16px 12px 16px;border-bottom:1px solid rgba(255,255,255,0.08);">
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;">
              <div>
                <div style="font-size:11px;color:#F59E0B;font-weight:700;letter-spacing:0.8px;text-transform:uppercase;">Reel #${idx + 1} of ${reelVerbs.length} • All Tenses</div>
                <div style="font-size:22px;font-weight:800;text-transform:uppercase;line-height:1.2;margin-top:2px;">${verb}</div>
              </div>
              <div style="display:flex;gap:6px;align-items:center;">
                <button id="vv-tense-prev" style="background:rgba(255,255,255,0.1);border:1px solid rgba(255,255,255,0.08);color:#fff;padding:7px 10px;border-radius:9px;font-size:12px;font-weight:700;cursor:pointer;">◀ Prev</button>
                <button id="vv-tense-next" style="background:rgba(255,255,255,0.1);border:1px solid rgba(255,255,255,0.08);color:#fff;padding:7px 10px;border-radius:9px;font-size:12px;font-weight:700;cursor:pointer;">Next ▶</button>
                <button id="vv-tense-close" style="background:rgba(255,255,255,0.12);border:none;color:#fff;width:32px;height:32px;border-radius:50%;font-size:15px;cursor:pointer;margin-left:2px;">✕</button>
              </div>
            </div>
            <div id="vv-reel-strip" style="display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none;">${pillsHtml}</div>
          </div>
          <div id="vv-tense-scroll-body" style="flex:1 1 auto;overflow-y:auto;padding:14px 16px 20px 16px;">
            ${sectionsHtml}
          </div>
        </div>
      `;

      const activePill = modal.querySelector('[data-pick="' + verb + '"]');
      if (activePill) activePill.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
    }

    renderContent(currentVerb);
    document.body.appendChild(modal);

    modal.addEventListener('click', (e) => {
      if (e.target === modal || e.target.id === 'vv-tense-close') {
        modal.remove();
        return;
      }
      if (e.target.id === 'vv-tense-prev') {
        const i = reelVerbs.indexOf(currentVerb);
        currentVerb = reelVerbs[(i - 1 + reelVerbs.length) % reelVerbs.length];
        renderContent(currentVerb);
        return;
      }
      if (e.target.id === 'vv-tense-next') {
        const i = reelVerbs.indexOf(currentVerb);
        currentVerb = reelVerbs[(i + 1) % reelVerbs.length];
        renderContent(currentVerb);
        return;
      }
      const pick = e.target.closest('[data-pick]');
      if (pick) {
        currentVerb = pick.getAttribute('data-pick');
        renderContent(currentVerb);
        return;
      }
      const row = e.target.closest('[data-say]');
      if (row) speakPhrase(row.getAttribute('data-say'));
    });
  }

  function cleanVaultAndWireTenses() {
    const reelVerbs = getOrderedReelVerbs();

    // 2. Add "All Tenses" button (no emoji) in Verb Vault header
    const vaultHeaders = Array.from(document.querySelectorAll('h1, h2, h3, div')).filter(el =>
      el.children.length === 0 && /Verb Vault/i.test(el.textContent || '')
    );
    vaultHeaders.forEach(hdr => {
      const parent = hdr.parentElement;
      if (!parent || parent.dataset.masterTenseAdded) return;
      parent.dataset.masterTenseAdded = '1';
      const topBtn = document.createElement('button');
      topBtn.type = 'button';
      topBtn.textContent = 'All Tenses';
      topBtn.style.cssText = 'margin-left:8px;padding:6px 12px;border-radius:999px;border:1px solid rgba(56,189,248,0.5);background:rgba(14,165,233,0.2);color:#F59E0B;font-size:12px;font-weight:700;cursor:pointer;';
      topBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        openTenseModal(reelVerbs[0]);
      });
      parent.appendChild(topBtn);
    });

    // 3. Add "All Tenses" button (no emoji) to each Verb Library card
    const cards = document.querySelectorAll('[class*="vault"], [class*="card"], [class*="verb"]');
    cards.forEach(card => {
      if (card.dataset.tenseWired) return;
      const text = card.innerText || '';
      if (!/Base:|Past:|Continuous:|Know It/i.test(text)) return;

      const heading = card.querySelector('h1, h2, h3, h4, strong, [class*="title"], [class*="word"]');
      const candidate = heading ? heading.innerText.trim().split(/\s+/)[0].replace(/[^a-zA-Z]/g, '').toLowerCase() : '';
      if (!candidate || !reelVerbs.includes(candidate)) return;

      card.dataset.tenseWired = '1';
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.textContent = 'All Tenses';
      btn.style.cssText = 'margin-top:8px;width:100%;padding:8px 10px;border-radius:10px;border:1px solid rgba(56,189,248,0.4);background:rgba(14,165,233,0.15);color:#F59E0B;font-size:12px;font-weight:700;cursor:pointer;';
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        openTenseModal(candidate);
      });
      card.appendChild(btn);
    });
  }

  setInterval(cleanVaultAndWireTenses, 600);
})();
</script>
